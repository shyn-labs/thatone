[project]
name = "bakeoff"
version = "0.0.1"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.0",
  "pyyaml>=6",
  "regex>=2024.0",
  "pillow>=10.1",
  "ocrmac>=1.0",
  "pypdfium2>=4.30",
  "mlx-whisper>=0.4",
  "rank-bm25>=0.2.2",
  "thatone-protocol",
]

[dependency-groups]
dev = ["pytest>=8", "fpdf2>=2.7"]

[tool.uv.sources]
thatone-protocol = { path = "../sidecar/protocol", editable = true }

[tool.pytest.ini_options]
markers = ["slow: needs ffmpeg/say/whisper or real OCR"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bakeoff"]
