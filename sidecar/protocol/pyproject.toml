[project]
name = "thatone-protocol"
version = "0.0.1"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=2.0"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thatone_protocol"]
